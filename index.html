<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%volleyballIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agenda Vôlei — Todos os jogos de vôlei: Superliga Brasileira, campeonatos estaduais e competições internacionais de seleções." />
    <meta name="theme-color" content="#1A3A5C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda Vôlei" />
    <link rel="apple-touch-icon" href="%BASE_URL%volleyballIcon.png" />
    <title>Agenda Vôlei</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Força atualização do Service Worker em caso de versão desatualizada
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var hasWaiting = registrations.some(function(r) { return r.waiting; });
          if (hasWaiting) {
            Promise.all(registrations.map(function(r) {
              if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });
              return r.unregister();
            })).then(function() {
              window.location.reload();
            });
          }
        });
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
