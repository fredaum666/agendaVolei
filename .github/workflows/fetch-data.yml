name: Fetch Games Data

on:
  schedule:
    - cron: '0 * * * *'  # toda hora
  workflow_dispatch:       # permite rodar manualmente

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch games from SofaScore
        run: node scripts/fetch-games.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "chore: atualizar dados de jogos [skip ci]"
          git push
